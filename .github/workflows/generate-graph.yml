name: Generate Codebase Graph

on:
  push:
    branches:
      - pre-stage
    paths:
      # Only run when code files change
      - 'src/**'
      - 'backend/**'
      - 'scripts/quick-generate.py'
      - 'scripts/parsers/**'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    # Prevent infinite loops - skip if commit was by this action
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[graph-gen]')"

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need full history for git info
          fetch-depth: 0
          # Use a token that can push
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate graph data
        run: |
          python scripts/quick-generate.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet public/graph-data.json 2>/dev/null || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/graph-data.json
          git commit -m "chore: update codebase graph [graph-gen]"
          git push
